[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kevin58but-pretraindata_jd324"
version = "0.1.0"
description = "把候选项映射到类别上，算出预训练数据工程师·尾延迟抖动与首 token 时间的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "kevin58but" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://kevin58but.github.io"
Repository = "https://github.com/kevin58but/pretraindata_jd324"
Issues = "https://github.com/kevin58but/pretraindata_jd324/issues"

[project.scripts]
pretraindata_jd324 = "pretraindata_jd324:main"

[tool.setuptools]
py-modules = ["pretraindata_jd324"]
